Description: X-Nite transforms Playnite Fullscreen into an Xbox-inspired experience built for controllers and TVs. Create personal profiles with independent avatars, colors and backgrounds; organize games into groups; customize the Home screen and pinned games; browse game details and achievements; and manage the experience through integrated, localized settings. X-Nite Profile System is required and should be installed first.
